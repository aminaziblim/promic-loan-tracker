<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b55">
<meta name="description" content="Monthly susu collection tracking app">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>SusuTrack — Monthly Susu Collection</title>
<style>
:root{--navy:#102b55;--blue:#2475ed;--teal:#0c9b79;--ink:#172b4d;--muted:#667995;--line:#e2eaf4;--bg:#f4f7fb;--white:#fff;--red:#d94755;--gold:#d98b14}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--blue);color:white}.secondary{background:#eaf2ff;color:#1859b8}.danger{background:#fff0f1;color:#b72d3a}.muted{color:var(--muted)}.app{min-height:100vh}.topbar{background:var(--navy);color:white;padding:15px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.brand img{width:36px;height:36px}.brand small{display:block;font-size:11px;font-weight:500;color:#cbd9ee}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{background:#24456f;color:white}.shell{max-width:1200px;margin:auto;padding:22px 18px 40px;display:grid;grid-template-columns:220px 1fr;gap:22px}.sidebar{display:flex;flex-direction:column;gap:7px}.navbtn{background:transparent;color:#526682;text-align:left;padding:12px 14px;border-radius:10px}.navbtn.active,.navbtn:hover{background:#e4efff;color:#1458ba}.main{min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.heading h1{margin:0;font-size:26px}.heading p{margin:4px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:0 2px 8px #17345b08}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:24px;font-weight:800;margin-top:6px;overflow-wrap:anywhere}.stat .sub{font-size:12px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel h2{font-size:17px;margin:0 0 14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel-head h2{margin:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf1f6;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#75849a}tr:last-child td{border-bottom:0}.pill{display:inline-block;border-radius:99px;padding:4px 8px;background:#e6f8f2;color:#087653;font-size:11px;font-weight:700}.pill.red{background:#fff0f1;color:#b72d3a}.pill.gold{background:#fff5df;color:#99600b}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:700;color:#536781}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #d7e1ef;border-radius:9px;padding:11px 12px;background:white;color:var(--ink);outline-color:#79aaff}.field textarea{min-height:75px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{max-width:300px}.empty{text-align:center;padding:30px;color:var(--muted)}.notice{border-radius:10px;padding:11px 13px;background:#fff5df;color:#79500c;font-size:12px;margin-bottom:16px}.hidden{display:none!important}.amount-pos{color:#07845d;font-weight:750}.amount-neg{color:#c63848;font-weight:750}.footer{max-width:1200px;margin:0 auto;padding:0 18px 24px;color:#8491a4;font-size:12px}.smallbtn{padding:7px 10px;font-size:12px}.mobile-nav{display:none}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding-top:14px}.sidebar{display:flex;flex-direction:row;overflow:auto;padding-bottom:4px}.navbtn{white-space:nowrap;padding:9px 12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.heading h1{font-size:23px}}
@media(max-width:520px){.topbar{padding:12px 14px}.brand{font-size:17px}.top-actions button{font-size:12px;padding:8px}.shell{padding-left:12px;padding-right:12px}.stats{gap:8px}.stat{padding:13px}.stat .value{font-size:20px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.heading{align-items:flex-start;flex-direction:column}.panel{padding:13px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt=""><div>SusuTrack<small>Monthly Susu Collection</small></div></div>
  <div class="top-actions"><button id="installBtn" class="hidden">Install app</button><button id="exportBtn">Export CSV</button></div>
</header>
<div class="shell">
  <nav class="sidebar" aria-label="Main navigation">
    <button class="navbtn active" data-page="dashboard">⌂ &nbsp; Dashboard</button>
    <button class="navbtn" data-page="customers">♙ &nbsp; Customers</button>
    <button class="navbtn" data-page="contributions">＋ &nbsp; Contributions</button>
    <button class="navbtn" data-page="withdrawals">↗ &nbsp; Withdrawals</button>
    <button class="navbtn" data-page="transactions">↻ &nbsp; Transactions</button>
    <button class="navbtn" data-page="reports">▥ &nbsp; Monthly Reports</button>
    <button class="navbtn" data-page="settings">⚙ &nbsp; Settings & Backup</button>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="footer">SusuTrack PWA · Local-first prototype. Data is stored in this browser on this device. Export backups regularly.</div>
</div>
<div id="modal" class="hidden"></div>
<script>
const KEY='susutrack_v1';
const now=new Date();
const monthNow=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
const money=n=>new Intl.NumberFormat('en-GH',{style:'currency',currency:'GHS',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=prefix=>prefix+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase();
let state=load(), page='dashboard', deferredPrompt=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{customers:[],transactions:[],company:'Susu Company',collector:'Administrator'}}catch(e){return {customers:[],transactions:[],company:'Susu Company',collector:'Administrator'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function dateStr(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function currentMonth(){return document.querySelector('#reportMonth')?.value||monthNow}
function balance(cid){return state.transactions.filter(t=>t.customerId===cid).reduce((sum,t)=>sum+(t.type==='contribution'?Number(t.amount):-Number(t.amount)),0)}
function totalForMonth(m,type){return state.transactions.filter(t=>t.date?.startsWith(m)&&(!type||t.type===type)).reduce((s,t)=>s+Number(t.amount),0)}
function customerName(cid){return state.customers.find(c=>c.id===cid)?.name||'Deleted customer'}
function go(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function pageHead(title,sub,button=''){return `<div class="heading"><div><h1>${title}</h1><p>${sub}</p></div>${button}</div>`}
function stat(label,value,sub=''){return `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
function txRows(list){if(!list.length)return `<tr><td colspan="7" class="empty">No transactions recorded yet.</td></tr>`;return list.slice().sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(customerName(t.customerId))}</td><td><span class="pill ${t.type==='withdrawal'?'red':''}">${t.type==='contribution'?'Contribution':'Withdrawal'}</span></td><td>${esc(t.method||'Cash')}</td><td class="${t.type==='contribution'?'amount-pos':'amount-neg'}">${t.type==='contribution'?'+':'−'}${money(t.amount)}</td><td>${esc(t.collector||'')}</td><td>${esc(t.ref||'')}</td></tr>`).join('')}
function render(){
 const main=document.querySelector('#main');
 if(page==='dashboard'){
  const m=monthNow, collected=totalForMonth(m,'contribution'), withdrawn=totalForMonth(m,'withdrawal'), net=state.customers.reduce((s,c)=>s+balance(c.id),0);
  main.innerHTML=pageHead('Dashboard','Monthly susu overview for '+m)+
  `<div class="notice">This starter app stores records on this device only. Use Settings & Backup to download a backup. For a company-wide live system, connect a secure shared database before using it for real customer funds.</div>
  <div class="stats">${stat('Total customer balances',money(net),'All recorded customer activity')}${stat('Contributions this month',money(collected),m)}${stat('Withdrawals this month',money(withdrawn),'Recorded payouts')}${stat('Registered customers',state.customers.length,'All customer accounts')}</div>
  <div class="grid2"><section class="panel"><div class="panel-head"><h2>Recent transactions</h2><button class="secondary smallbtn" onclick="go('transactions')">View all</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Type</th><th>Method</th><th>Amount</th><th>Collector</th><th>Reference</th></tr></thead><tbody>${txRows(state.transactions.slice().sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,12))}</tbody></table></div></section>
  <section class="panel"><h2>Quick actions</h2><div class="actions"><button class="primary" onclick="go('customers')">＋ Add customer</button><button class="secondary" onclick="go('contributions')">Record contribution</button><button class="secondary" onclick="go('withdrawals')">Record withdrawal</button><button class="secondary" onclick="go('reports')">View monthly report</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>Monthly summary</h2><p class="muted">Contributions <strong class="amount-pos">${money(collected)}</strong></p><p class="muted">Withdrawals <strong class="amount-neg">${money(withdrawn)}</strong></p><p class="muted">Net collected this month <strong>${money(collected-withdrawn)}</strong></p></section></div>`;
 } else if(page==='customers'){
  main.innerHTML=pageHead('Customers','Register and manage customer accounts','<button class="primary" onclick="customerForm()">＋ Add customer</button>')+
  `<div class="panel"><div class="toolbar"><input id="customerSearch" class="search" placeholder="Search name, phone or customer ID…" oninput="filterCustomers()"></div><div class="tablewrap"><table id="customerTable"><thead><tr><th>Customer ID</th><th>Name</th><th>Phone</th><th>Location</th><th>Monthly target</th><th>Current balance</th><th>Actions</th></tr></thead><tbody>${customerRows(state.customers)}</tbody></table></div></div>`;
 } else if(page==='contributions'||page==='withdrawals'){
  const isCon=page==='contributions';
  main.innerHTML=pageHead(isCon?'Record Contribution':'Record Withdrawal',isCon?'Record a customer’s monthly susu payment.':'Record a customer payout or withdrawal.')+
  (state.customers.length?`<div class="panel"><form id="txForm"><div class="formgrid"><div class="field"><label>Customer *</label><select name="customerId" required>${state.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.id)}</option>`).join('')}</select></div><div class="field"><label>Amount (GH₵) *</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>Transaction date *</label><input name="date" type="date" value="${dateStr()}" required></div><div class="field"><label>Collection month *</label><input name="month" type="month" value="${monthNow}" required></div><div class="field"><label>Payment method</label><select name="method"><option>Cash</option><option>Mobile Money</option><option>Bank transfer</option><option>Other</option></select></div><div class="field"><label>Collector name</label><input name="collector" value="${esc(state.collector||'Administrator')}" placeholder="Collector name"></div><div class="field full"><label>Notes (optional)</label><textarea name="notes" placeholder="Payment notes or receipt details"></textarea></div></div><div id="balanceHint" class="notice">Select a customer to view their current balance.</div><button class="primary" type="submit">Save ${isCon?'contribution':'withdrawal'}</button></form></div>`:`<div class="panel empty">Register a customer before recording transactions. <br><br><button class="primary" onclick="go('customers')">Add customer</button></div>`);
  const form=document.querySelector('#txForm');if(form){const sel=form.customerId;const hint=()=>{const c=state.customers.find(x=>x.id===sel.value);document.querySelector('#balanceHint').innerHTML=c?`Current balance for <strong>${esc(c.name)}</strong>: <strong>${money(balance(c.id))}</strong>`:''};sel.addEventListener('change',hint);hint();form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form),amount=Number(fd.get('amount')),cid=fd.get('customerId');if(!Number.isFinite(amount)||amount<=0)return alert('Enter an amount greater than zero.');if(!isCon&&amount>balance(cid))return alert('This withdrawal is higher than the customer’s recorded balance. Check the amount or record prior contributions first.');const t={id:id('TX'),ref:id('ST'),customerId:cid,type:isCon?'contribution':'withdrawal',amount,date:fd.get('date'),month:fd.get('month'),method:fd.get('method'),collector:fd.get('collector'),notes:fd.get('notes'),createdAt:new Date().toISOString()};state.transactions.push(t);save();alert(`${isCon?'Contribution':'Withdrawal'} saved. Reference: ${t.ref}`);go('transactions')})}
 } else if(page==='transactions'){
  main.innerHTML=pageHead('Transactions','Review all recorded contributions and withdrawals','<button class="primary" onclick="downloadCSV()">Export CSV</button>')+
  `<div class="panel"><div class="toolbar"><input id="txSearch" class="search" placeholder="Search customer, date, reference…" oninput="filterTransactions()"><select id="txType" class="search" onchange="filterTransactions()"><option value="">All transaction types</option><option value="contribution">Contributions</option><option value="withdrawal">Withdrawals</option></select><input id="txMonth" class="search" type="month" value="${monthNow}" onchange="filterTransactions()"><button class="secondary" onclick="document.querySelector('#txMonth').value='';filterTransactions()">All months</button></div><div class="tablewrap"><table id="txTable"><thead><tr><th>Date</th><th>Customer</th><th>Type</th><th>Method</th><th>Amount</th><th>Collector</th><th>Reference</th></tr></thead><tbody>${txRows(state.transactions)}</tbody></table></div></div>`;
 } else if(page==='reports'){
  const m=monthNow;
  main.innerHTML=pageHead('Monthly Reports','Monthly collections, withdrawals and customer balances','<button class="primary" onclick="downloadCSV()">Export transactions</button>')+
  `<div class="panel"><div class="toolbar"><label style="align-self:center;font-weight:700">Report month</label><input class="search" id="reportMonth" type="month" value="${m}" onchange="updateReport()"></div><div id="reportContent">${reportContent(m)}</div></div>`;
 } else if(page==='settings'){
  main.innerHTML=pageHead('Settings & Backup','Manage company details and protect your records')+
  `<div class="grid2"><section class="panel"><h2>Company details</h2><form id="settingsForm"><div class="field"><label>Company name</label><input name="company" value="${esc(state.company)}" required></div><div class="field"><label>Default collector / operator</label><input name="collector" value="${esc(state.collector)}"></div><button class="primary">Save settings</button></form></section><section class="panel"><h2>Backup and restore</h2><p class="muted">Download a JSON backup regularly. Restore replaces the records currently stored in this browser.</p><div class="actions"><button class="primary" onclick="backupJSON()">Download backup</button><label class="secondary" style="display:inline-block;padding:10px 14px;border-radius:10px;font-weight:650;cursor:pointer">Restore backup<input id="restoreFile" type="file" accept=".json,application/json" hidden></label></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h2>Data status</h2><p>Customers: <strong>${state.customers.length}</strong></p><p>Transactions: <strong>${state.transactions.length}</strong></p><div class="notice">Privacy note: records are not synced between devices and this prototype does not provide real user authentication. Do not rely on it as the sole record system for actual funds until secure server storage, access control and tested backups are configured.</div><button class="danger" onclick="clearAll()">Clear all local data</button></section></div>`;
  document.querySelector('#settingsForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);state.company=f.get('company');state.collector=f.get('collector');save();alert('Settings saved.');render()});
  document.querySelector('#restoreFile').addEventListener('change',restoreJSON);
 }
}
function customerRows(list){if(!list.length)return `<tr><td colspan="7" class="empty">No customers yet. Select “Add customer” to get started.</td></tr>`;return list.map(c=>`<tr><td><strong>${esc(c.id)}</strong></td><td>${esc(c.name)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.location||'—')}</td><td>${money(c.target||0)}</td><td class="amount-pos">${money(balance(c.id))}</td><td><div class="actions"><button class="secondary smallbtn" onclick="customerStatement('${c.id}')">Statement</button><button class="secondary smallbtn" onclick="customerForm('${c.id}')">Edit</button></div></td></tr>`).join('')}
function customerForm(cid=''){const c=state.customers.find(x=>x.id===cid)||{name:'',phone:'',location:'',target:'',notes:''};const modal=document.querySelector('#modal');modal.className='';modal.innerHTML=`<div style="position:fixed;inset:0;background:#091a30a6;display:grid;place-items:center;padding:16px;z-index:5" onclick="if(event.target===this)closeModal()"><div class="panel" style="width:min(560px,100%);max-height:90vh;overflow:auto"><div class="panel-head"><h2>${cid?'Edit customer':'Register customer'}</h2><button class="secondary" onclick="closeModal()">Close</button></div><form id="customerForm"><div class="formgrid"><div class="field full"><label>Full name *</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(c.phone)}" placeholder="e.g. 0240000000"></div><div class="field"><label>Location</label><input name="location" value="${esc(c.location)}" placeholder="Town / area"></div><div class="field"><label>Expected monthly contribution (GH₵)</label><input name="target" type="number" min="0" step=".01" value="${esc(c.target)}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div><div class="actions"><button class="primary">Save customer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form></div></div>`;
 document.querySelector('#customerForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(cid){Object.assign(c,{name:f.get('name').trim(),phone:f.get('phone').trim(),location:f.get('location').trim(),target:Number(f.get('target')||0),notes:f.get('notes')})}else{state.customers.push({id:id('CUS'),name:f.get('name').trim(),phone:f.get('phone').trim(),location:f.get('location').trim(),target:Number(f.get('target')||0),notes:f.get('notes'),createdAt:new Date().toISOString()})}save();closeModal();render()})}
function closeModal(){const m=document.querySelector('#modal');m.className='hidden';m.innerHTML=''}
function filterCustomers(){const q=document.querySelector('#customerSearch').value.toLowerCase();document.querySelector('#customerTable tbody').innerHTML=customerRows(state.customers.filter(c=>[c.name,c.phone,c.location,c.id].some(x=>String(x||'').toLowerCase().includes(q))))}
function filterTransactions(){const q=document.querySelector('#txSearch').value.toLowerCase(),type=document.querySelector('#txType').value,m=document.querySelector('#txMonth').value;const list=state.transactions.filter(t=>(!type||t.type===type)&&(!m||t.date.startsWith(m))&&[customerName(t.customerId),t.date,t.ref,t.collector,t.method].some(x=>String(x||'').toLowerCase().includes(q)));document.querySelector('#txTable tbody').innerHTML=txRows(list)}
function reportContent(m){const list=state.transactions.filter(t=>(t.month||t.date.slice(0,7))===m),con=list.filter(t=>t.type==='contribution').reduce((s,t)=>s+t.amount,0),wd=list.filter(t=>t.type==='withdrawal').reduce((s,t)=>s+t.amount,0);return `<div class="stats">${stat('Contributions',money(con),m)}${stat('Withdrawals',money(wd),m)}${stat('Net movement',money(con-wd),'Contributions less withdrawals')}${stat('Transactions',list.length,'For selected month')}</div><h2>Customer monthly summary</h2><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Monthly target</th><th>Contributed</th><th>Withdrawn</th><th>Current balance</th><th>Target progress</th></tr></thead><tbody>${state.customers.length?state.customers.map(c=>{const ct=list.filter(t=>t.customerId===c.id&&t.type==='contribution').reduce((s,t)=>s+t.amount,0),wt=list.filter(t=>t.customerId===c.id&&t.type==='withdrawal').reduce((s,t)=>s+t.amount,0),p=c.target?Math.min(100,Math.round(ct/c.target*100)):null;return `<tr><td>${esc(c.name)}</td><td>${money(c.target)}</td><td class="amount-pos">${money(ct)}</td><td class="amount-neg">${money(wt)}</td><td>${money(balance(c.id))}</td><td>${p===null?'—':p+'%'}</td></tr>`}).join(''):`<tr><td colspan="6" class="empty">Register customers to build reports.</td></tr>`}</tbody></table></div>`}
function updateReport(){document.querySelector('#reportContent').innerHTML=reportContent(document.querySelector('#reportMonth').value)}
function customerStatement(cid){const c=state.customers.find(x=>x.id===cid);if(!c)return;const list=state.transactions.filter(t=>t.customerId===cid).sort((a,b)=>a.date.localeCompare(b.date));const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to view the statement.');return}w.document.write(`<html><head><title>Customer statement</title><style>body{font:14px Arial;padding:30px;color:#172b4d}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.total{font-size:20px;font-weight:bold}</style></head><body><h1>${esc(state.company)}</h1><h2>Customer statement</h2><p><b>Customer:</b> ${esc(c.name)} &nbsp; <b>ID:</b> ${esc(c.id)}</p><p><b>Phone:</b> ${esc(c.phone||'—')} &nbsp; <b>Location:</b> ${esc(c.location||'—')}</p><table><tr><th>Date</th><th>Type</th><th>Reference</th><th>Amount</th></tr>${list.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.ref)}</td><td>${t.type==='contribution'?'+':'−'}${money(t.amount)}</td></tr>`).join('')}</table><p class="total">Current balance: ${money(balance(cid))}</p><p>Printed ${dateStr()}</p><script>window.print()<\/script></body></html>`);w.document.close()}
function downloadCSV(){const rows=[['Transaction ID','Reference','Date','Collection Month','Customer ID','Customer Name','Type','Amount GHS','Method','Collector','Notes'],...state.transactions.map(t=>[t.id,t.ref,t.date,t.month||t.date.slice(0,7),t.customerId,customerName(t.customerId),t.type,t.amount,t.method,t.collector,t.notes])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile('susutrack-transactions-'+dateStr()+'.csv',csv,'text/csv;charset=utf-8')}
function backupJSON(){downloadFile('susutrack-backup-'+dateStr()+'.json',JSON.stringify(state,null,2),'application/json')}
function restoreJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.customers)||!Array.isArray(data.transactions))throw Error('Invalid backup');if(!confirm('This will replace current local records. Continue?'))return;state=data;save();alert('Backup restored.');render()}catch(err){alert('Could not restore this file. Please select a valid SusuTrack JSON backup.')}};r.readAsText(f)}
function downloadFile(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function clearAll(){if(confirm('Permanently clear all customers and transactions stored in this browser? Download a backup first if needed.')){state={customers:[],transactions:[],company:state.company,collector:state.collector};save();render()}}
document.querySelector('#exportBtn').addEventListener('click',downloadCSV);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.querySelector('#installBtn').classList.remove('hidden')});
document.querySelector('#installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.querySelector('#installBtn').classList.add('hidden')});
if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}
render();
</script>
</body>
</html>
